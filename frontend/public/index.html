<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B0B0E" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
        Font diambil tanpa memblokir render: sebagai stylesheet biasa ia menunda
        tampilnya seluruh halaman selama permintaan ke Google Fonts. media="print"
        membuatnya diunduh dengan prioritas rendah, lalu dipasang setelah siap.
        -->
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
        <!--
        Gambar hero adalah elemen LCP, tetapi ia dirender oleh React sehingga
        browser baru menemukannya setelah bundel JS dijalankan. Preload membuatnya
        berangkat bersamaan dengan HTML.
        -->
        <link rel="preload" as="image" href="%PUBLIC_URL%/hero-pagarnusa-900.webp"
              imagesrcset="%PUBLIC_URL%/hero-pagarnusa-900.webp 900w, %PUBLIC_URL%/hero-pagarnusa-1600.webp 1600w"
              imagesizes="100vw" fetchpriority="high" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Nusa Wiraga 2026 — Kejuaraan Nasional Pencak Silat</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
